#параметры
--fullscreen=yes
--deinterlace=auto
--title-bar=no
--save-position-on-quit
--keep-open=yes
--ytdl-format="bestvideo[height<=?1080]+bestaudio/best"
--volume-max=200
--no-sub
--screenshot-template=C:\Users\Username\Desktop\mpv-screenshot-%td-%tm-%ty-%n
--screenshot-format=png
--ontop=yes
--user-agent="Mozilla/5.0"
#hwdec=auto-safe
--vo=gpu-next
--video-sync=display-resample
--sub-file-paths=**
--cache=no
--demuxer-max-bytes=800M
--demuxer-max-back-bytes=500M
--cache-dir=/tmp
--cache-on-disk=yes

#аудио и субтитры
sub-auto=exact                            # автоматически загружать внешние субтитры с одинаковым именем
alang=rus,ru,russian,unknown              # автоматически выбирать аудио на заданном языке
slang=rus,ru,russian,unknown              # автоматически выбирать субтитры на заданном язык
sid=1
--audio-file-paths=**

--audio-file-auto=fuzzy

--sub-auto=fuzzy
--audio-device=wasapi/{названия устройства}
--audio-exclusive=yes
