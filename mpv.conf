############################
#   Интерфейс и поведение  #
############################

fullscreen=yes                         # Запускать видео сразу во весь экран
ontop=yes                              # Держать окно плеера поверх всех остальных окон
border=no                              # Отключить классическую рамку окна Windows
title-bar=no                           # Скрыть заголовок окна
keep-open=yes                          # Не закрывать плеер после завершения воспроизведения
save-position-on-quit=yes              # Запоминать время остановки при выходе
osc=yes                                # Включить встроенный экранный контроллер (интерфейс)
script-opts=osc-windowcontrols=yes,osc-title="${media-title}" # Настройка кнопок управления окном и заголовка

############################
#    Видео и Рендеринг     #
############################

vd-lavc-threads=0                      # Проц декодирует видео во все потоки
swapchain-depth=3                      # Плавная подача кадров на экран
vo=gpu-next                            # Использовать современный видеовывод (лучшая цветопередача)
gpu-api=d3d11                          # Использовать DirectX 11 (наиболее стабильно для Windows)
d3d11-exclusive-fs=yes                 # Эксклюзивный полноэкранный режим (плавнее картинка)
video-sync=display-resample            # Синхронизация кадров с частотой монитора (убирает рывки)
deinterlace=auto                       # Автоматическое устранение "гребенки" (чересстрочности)
profile=high-quality                   # Использовать встроенный профиль высокого качества
#hwdec=auto-safe                       # Аппаратное декодирование (раскомментировать при лагах)

############################
#          Аудио           #
############################

volume-max=200                         # Максимальное усиление громкости (до 200%)
audio-exclusive=yes                    # Захватывать звук монопольно (выше качество, нет звуков системы)
audio-device=auto                      # Вывод на конкретное аудиоустройство
alang=rus,ru,russian,unknown           # Приоритет выбора аудиодорожек (русский)
audio-file-auto=fuzzy                  # Подхватывать внешние аудиофайлы с похожим именем
audio-file-paths=**                    # Искать аудио во всех вложенных папках

############################
#        Субтитры          #
############################

no-sub                                 # Отключить субтитры по умолчанию при запуске
slang=rus,ru,russian,unknown           # Приоритет выбора языка субтитров (русский)
sid=1                                  # Выбирать первую дорожку субтитров, если включены
sub-auto=fuzzy                         # Подгружать внешние субтитры с похожим именем
sub-file-paths=**                      # Искать субтитры во всех вложенных папках

############################
#    Сеть и Интернет       #
############################

ytdl-format="bestvideo[height<=?1080]+bestaudio/best" # Ограничить YouTube видео до 1080p
user-agent="Mozilla/5.0"               # Маскировка под браузер для обхода ограничений сайтов
cache=yes                              # Включить использование кэша
cache-on-disk=yes                      # Разрешить сохранение кэша на диск
cache-dir="C:\Users\Timofej\AppData\Local\Temp\mpv-cache" # Папка для временных файлов кэша
demuxer-max-bytes=800M                 # Максимальный объем кэша для предзагрузки (800 МБ)
demuxer-max-back-bytes=500M            # Объем кэша для перемотки назад (500 МБ)

############################
#       Скриншоты          #
############################

screenshot-format=png                  # Формат скриншотов без потери качества (PNG)
screenshot-template="C:\Users\Timofej\Pictures\MPV-%td-%tm-%ty-%n" # Путь и шаблон имени файла
